<svg width="320" height="192" viewBox="0 0 320 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Définition du dégradé -->
  <defs>
    <linearGradient id="calcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond avec dégradé -->
  <rect width="320" height="192" rx="8" fill="url(#calcGradient)"/>
  
  <!-- Calculatrice stylisée -->
  <rect x="60" y="40" width="200" height="112" rx="8" fill="#1a1a2e" opacity="0.9" stroke="#7dd3fc" stroke-width="2"/>
  
  <!-- Écran -->
  <rect x="70" y="50" width="180" height="30" rx="4" fill="#0a0a1a" opacity="0.95"/>
  <text x="75" y="70" font-family="monospace" font-size="16" fill="#7dd3fc" font-weight="600">123.45</text>
  
  <!-- Boutons mémoire (rangée du haut) -->
  <rect x="70" y="90" width="30" height="20" rx="3" fill="#3b82f6" opacity="0.8"/>
  <text x="75" y="103" font-family="Arial" font-size="10" fill="#ffffff" font-weight="600">MC</text>
  
  <rect x="105" y="90" width="30" height="20" rx="3" fill="#3b82f6" opacity="0.8"/>
  <text x="110" y="103" font-family="Arial" font-size="10" fill="#ffffff" font-weight="600">MR</text>
  
  <!-- Boutons numériques -->
  <circle cx="85" cy="125" r="10" fill="#ffffff" opacity="0.9"/>
  <text x="82" y="130" font-family="Arial" font-size="12" fill="#1a1a2e" font-weight="600">7</text>
  
  <circle cx="115" cy="125" r="10" fill="#ffffff" opacity="0.9"/>
  <text x="112" y="130" font-family="Arial" font-size="12" fill="#1a1a2e" font-weight="600">8</text>
  
  <circle cx="145" cy="125" r="10" fill="#ffffff" opacity="0.9"/>
  <text x="142" y="130" font-family="Arial" font-size="12" fill="#1a1a2e" font-weight="600">9</text>
  
  <circle cx="175" cy="125" r="10" fill="#fbbf24" opacity="0.9"/>
  <text x="172" y="130" font-family="Arial" font-size="12" fill="#1a1a2e" font-weight="600">÷</text>
  
  <!-- Bouton égal -->
  <rect x="200" y="115" width="50" height="30" rx="4" fill="#10b981" opacity="0.9"/>
  <text x="220" y="135" font-family="Arial" font-size="16" fill="#ffffff" font-weight="700">=</text>
  
  <!-- Icône scientifique (positionnée à l'intérieur du cadre calculatrice : rect 60–260) -->
  <text x="205" y="100" font-family="Arial" font-size="22" fill="#ffffff" opacity="0.8">sin</text>
</svg>

