<svg width="320" height="192" viewBox="0 0 320 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Définition du dégradé -->
  <defs>
    <linearGradient id="constGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond avec dégradé -->
  <rect width="320" height="192" rx="8" fill="url(#constGrad)"/>
  
  <!-- Étoiles de fond -->
  <circle cx="50" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="60" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="30" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="280" cy="50" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="120" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="250" cy="140" r="1.5" fill="#ffffff" opacity="0.7"/>
  
  <!-- Constellation Orion (simplifiée) -->
  <!-- Lignes de connexion -->
  <line x1="100" y1="60" x2="120" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="50" x2="140" y2="55" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="140" y1="55" x2="160" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="160" y1="50" x2="180" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="60" x2="180" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Étoiles principales -->
  <circle cx="100" cy="60" r="4" fill="#ff6b47" opacity="0.9"/>
  <circle cx="100" cy="60" r="2" fill="#ffffff"/>
  
  <circle cx="120" cy="50" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="140" cy="55" r="3" fill="#b3d9ff" opacity="0.9"/>
  <circle cx="160" cy="50" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="180" cy="70" r="4" fill="#b3d9ff" opacity="0.9"/>
  <circle cx="180" cy="70" r="2" fill="#ffffff"/>
  
  <!-- Constellation Grande Ourse (simplifiée) -->
  <line x1="60" y1="120" x2="80" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="110" x2="100" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="115" x2="120" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="110" x2="140" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  
  <circle cx="60" cy="120" r="2.5" fill="#ffeb99" opacity="0.8"/>
  <circle cx="80" cy="110" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="100" cy="115" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="120" cy="110" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="140" cy="120" r="2.5" fill="#ffffff" opacity="0.8"/>
  
  <!-- Icône constellation -->
  <text x="250" y="160" font-family="Arial" font-size="32" fill="#ffffff" opacity="0.7">⭐</text>
</svg>

