<svg width="320" height="240" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGrad">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" fill="url(#solarGrad)"/>
  
  <!-- Orbits -->
  <circle cx="160" cy="120" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="160" cy="120" r="100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="160" cy="120" r="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Sun -->
  <circle cx="160" cy="120" r="20" fill="url(#sunGrad)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Planets -->
  <circle cx="240" cy="120" r="4" fill="#8c7853" opacity="0.8"/>
  <circle cx="220" cy="100" r="4" fill="#e6be8a" opacity="0.8"/>
  <circle cx="200" cy="80" r="5" fill="#4b6cb7" opacity="0.8"/>
  <circle cx="180" cy="60" r="4" fill="#c1440e" opacity="0.8"/>
  
  <!-- Stars -->
  <circle cx="50" cy="40" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="280" cy="50" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="30" cy="200" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="290" cy="190" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="100" cy="30" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="30" r="1" fill="#fff" opacity="0.6"/>
</svg>

