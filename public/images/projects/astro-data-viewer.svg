  <rect x="95" y="145" width="80" height="20" fill="url(#astroGrad1)" opacity="0.3" rx="2"/>
  <rect x="95" y="170" width="60" height="3" fill="rgba(255, 255, 255, 0.3)" rx="1.5"/>
