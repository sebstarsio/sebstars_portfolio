  <rect x="90" y="20" width="40" height="50" fill="rgba(255, 255, 255, 0.1)" rx="4"/>
  <rect x="90" y="20" width="40" height="30" fill="url(#astroGrad1)" opacity="0.6" rx="4"/>
  <circle cx="100" cy="35" r="3" fill="#ffffff"/>
  <circle cx="110" cy="35" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="120" cy="35" r="2" fill="#ffffff" opacity="0.5"/>
  
  <rect x="140" y="20" width="40" height="50" fill="rgba(255, 255, 255, 0.1)" rx="4"/>
  <rect x="140" y="20" width="40" height="30" fill="url(#astroGrad2)" opacity="0.6" rx="4"/>
  <rect x="145" y="25" width="30" height="20" fill="rgba(255, 255, 255, 0.3)" rx="2"/>
  
  <rect x="90" y="80" width="40" height="50" fill="rgba(255, 255, 255, 0.1)" rx="4"/>
