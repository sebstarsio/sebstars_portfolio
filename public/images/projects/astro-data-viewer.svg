  <ellipse cx="110" cy="95" rx="8" ry="4" fill="rgba(255, 255, 255, 0.4)"/>
  
  <rect x="140" y="80" width="40" height="50" fill="rgba(255, 255, 255, 0.1)" rx="4"/>
