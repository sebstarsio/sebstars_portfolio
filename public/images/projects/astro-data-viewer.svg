  <rect x="15" y="20" width="50" height="4" fill="#46e6ff" rx="2"/>
  <rect x="15" y="30" width="50" height="4" fill="rgba(255, 255, 255, 0.3)" rx="2"/>
  <rect x="15" y="40" width="50" height="4" fill="rgba(255, 255, 255, 0.3)" rx="2"/>
  
  <!-- Main content area -->
  <rect x="80" y="10" width="110" height="180" fill="rgba(15, 23, 42, 0.6)" rx="4"/>
  
